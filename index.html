<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lettore TTS Neural & ePub</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 650px; margin: auto; background: #f4f6f9; color: #333; }
    h2 { text-align: center; color: #1a252f; margin-bottom: 15px; }
    .file-input-container { margin-bottom: 15px; background: #fff; padding: 12px; border-radius: 8px; border: 1px dashed #0066cc; text-align: center; }
    input[type="file"] { display: none; }
    .custom-file-upload { display: inline-block; padding: 8px 16px; background: #0066cc; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
    textarea { width: 100%; height: 200px; padding: 12px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; margin-bottom: 12px; resize: vertical; }
    .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    select, button { padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; background: white; }
    button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:disabled { background: #999; }
    #status { margin-top: 10px; font-weight: bold; font-size: 14px; text-align: center; word-break: break-all; padding: 10px; border-radius: 6px; display: none; border: 1px solid transparent; }
    audio { width: 100%; margin-top: 15px; }
  </style>
</head>
<body>

  <h2>Lettore Vocale TTS & ePub</h2>

  <div class="file-input-container">
    <label for="filePicker" class="custom-file-upload">
      📁 Carica un libro (.ePub)
    </label>
    <input type="file" id="filePicker" accept=".epub" onchange="loadEpub(event)">
    <div id="fileName" style="font-size: 12px; margin-top: 5px; color: #666;">Oppure incolla direttamente il testo sotto</div>
  </div>

  <textarea id="textInput" placeholder="Incolla qui il testo o carica un file .ePub..."></textarea>

  <div class="controls">
    <select id="voiceSelect">
      <option value="it-IT-DiegoNeural">Diego (Italiano - Maschile)</option>
      <option value="it-IT-ElianaNeural">Eliana (Italiano - Femminile)</option>
      <option value="it-IT-IsabellaNeural">Isabella (Italiano - Espressiva)</option>
    </select>
    <button id="playBtn" onclick="processAndPlay()">Leggi Testo</button>
  </div>

  <div id="status"></div>
  <audio id="audioPlayer" controls></audio>

  <script>
    const WORKER_URL = "https://azure-tts-proxy.mic-max-1000.workers.dev";

    function showStatus(msg, isError = false) {
      const status = document.getElementById('status');
      status.style.display = 'block';
      status.style.color = isError ? '#d9534f' : '#155724';
      status.style.backgroundColor = isError ? '#fff3f3' : '#e8f8f0';
      status.style.borderColor = isError ? '#f5c6cb' : '#b7e1cd';
      status.innerText = msg;
    }

    async function loadEpub(event) {
      const file = event.target.files[0];
      if (!file) return;

      const textInput = document.getElementById('textInput');
      document.getElementById('fileName').innerText = "File caricato: " + file.name;

      showStatus("Estrazione testo dal libro in corso...", false);
      textInput.value = "";

      try {
        const reader = new FileReader();
        reader.onload = async function(e) {
          const book = ePub(e.target.result);
          await book.ready;

          let fullText = "";
          const spine = book.spine;

          for (const item of spine.spineItems) {
            const doc = await item.load(book.load.bind(book));
            const text = doc.textContent || (doc.body && doc.body.innerText) || "";
            if (text.trim()) {
              fullText += text.trim() + "\n\n";
            }
          }

          textInput.value = fullText;
          showStatus("ePub caricato con successo! Premi 'Leggi Testo'.", false);
        };
        reader.readAsArrayBuffer(file);
      } catch (err) {
        showStatus("Errore ePub: " + err.message, true);
      }
    }

    function chunkText(text, maxLength = 800) {
      const sentences = text.match(/[^.!?]+[.!?]+|\s*$/g) || [text];
      const chunks = [];
      let currentChunk = "";

      for (const sentence of sentences) {
        if ((currentChunk + sentence).length <= maxLength) {
          currentChunk += sentence;
        } else {
          if (currentChunk.trim()) chunks.push(currentChunk.trim());
          currentChunk = sentence;
        }
      }
      if (currentChunk.trim()) chunks.push(currentChunk.trim());
      return chunks;
    }

    async function processAndPlay() {
      const text = document.getElementById('textInput').value;
      const voice = document.getElementById('voiceSelect').value;
      const playBtn = document.getElementById('playBtn');
      const audioPlayer = document.getElementById('audioPlayer');

      if (!text.trim()) {
        showStatus("Inserisci o carica un testo!", true);
        return;
      }

      playBtn.disabled = true;
      showStatus("Generazione audio in corso...", false);

      const chunks = chunkText(text);

      try {
        const cleanUrl = WORKER_URL.replace(/\/$/, "");

        // Per ora inviamo solo il primo chunk
        const response = await fetch(cleanUrl, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain",
            "X-Voice": voice
          },
          body: chunks[0]
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`HTTP ${response.status}: ${errText}`);
        }

        const blob = await response.blob();
        const audioUrl = URL.createObjectURL(blob);
        audioPlayer.src = audioUrl;
        await audioPlayer.play();
        showStatus("Riproduzione avviata!", false);
      } catch (e) {
        showStatus("Errore: " + e.message, true);
      } finally {
        playBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
